name: collect-jobs
on:
  schedule:
    - cron: "17 2 * * *"    # 07:47 IST: full run (Feashliaa + JobSpy + descriptions)
    - cron: "17 12 * * *"   # 17:47 IST: JobSpy only
  workflow_dispatch:
    inputs:
      mode:
        description: "full, jobspy-only, or recheck (re-check board cards with unknown experience)"
        default: full
        type: choice
        options: [full, jobspy-only, recheck, assist]
permissions:
  contents: write                     # commit data/seen.txt + data/all_jobs_latest.csv
  models: read                        # GitHub Models (free) writes the application packs
concurrency: collect-jobs
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - uses: actions/cache@v4
        with: {path: model_cache, key: bge-small-en-v1.5}
      - run: pip install -r requirements.txt pytest
      - name: Rule tests (stop before touching the board if scoring rules broke)
        run: python -m pytest tests -q
      - name: Collect
        run: |
          if [ "${{ inputs.mode }}" = "assist" ]; then
            exit 0
          elif [ "${{ inputs.mode }}" = "recheck" ]; then
            python collector.py --recheck
          elif [ "${{ github.event.schedule }}" = "17 12 * * *" ] || [ "${{ inputs.mode }}" = "jobspy-only" ]; then
            python collector.py --jobspy-only
          else
            python collector.py
          fi
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      - name: Application packs, follow-ups, interview prep (prepares only; never applies)
        run: python assist.py
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # optional; without it GitHub Models is used
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Save seen jobs + full list
        run: |
          git config user.name "job-collector-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || (git commit -m "data: $(date -u +%F-%H%M) run" && git pull -q --rebase && git push)
